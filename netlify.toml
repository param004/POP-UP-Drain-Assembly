[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite emits absolute asset paths, so the bundle lives at the site root.
[build.processing]
  skip_processing = false

# This is a single-page app: every route is resolved by react-router in the
# browser, so a hard refresh or a shared deep link like /products/pop-up-drain
# must fall through to index.html rather than 404. Without this, Netlify returns
# its own 404 page for anything that isn't a real file in dist/.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived caching for the hashed bundles under /assets/. The filenames
# contain a content hash, so they are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The 3D model is a few megabytes. Let the browser cache it, but keep it
# revalidated so a corrected model actually reaches returning visitors.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
