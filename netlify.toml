[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite emits absolute asset paths, so the bundle lives at the site root.
[build.processing]
  skip_processing = false

# The SPA fallback lives in client/public/_redirects, not here. Vite copies
# public/ verbatim into dist/, so it ships as dist/_redirects. Keep it in one
# place only — a second [[redirects]] block here would duplicate the rule.

# Long-lived caching for the hashed bundles under /assets/. The filenames
# contain a content hash, so they are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The 3D model is a few megabytes. Let the browser cache it, but keep it
# revalidated so a corrected model actually reaches returning visitors.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
